    ];

    const userAnswers = {};

    function renderQuiz() {
      const container = document.getElementById("quiz");
      let html = "";

      quizData.forEach((item) => {
        html += `
          <div class="question-card" id="q-card-${item.id}">
            <div class="question-title">${item.id}. ${item.q.replace(/\n/g, "<br>")}</div>
            <div class="options">
        `;

        Object.keys(item.opts).forEach((key) => {
          html += `
            <button class="option-btn" id="btn-${item.id}-${key}" onclick="selectOption(${item.id}, '${key}')">
              <strong>${key})</strong> ${item.opts[key]}
            </button>
          `;
        });

        html += `
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function selectOption(qId, key) {
      userAnswers[qId] = key;
      const opts = ["A", "B", "C", "D"];
      opts.forEach((k) => {
        const btn = document.getElementById(`btn-${qId}-${k}`);
        if (btn) {
          btn.classList.remove("selected");
        }
      });
      const selectedBtn = document.getElementById(`btn-${qId}-${key}`);
      if (selectedBtn) {
        selectedBtn.classList.add("selected");
      }
    }

    function checkAnswers() {
      let score = 0;

      quizData.forEach((item) => {
        const selected = userAnswers[item.id];
        const correct = item.ans;

        Object.keys(item.opts).forEach((key) => {
          const btn = document.getElementById(`btn-${item.id}-${key}`);
          if (btn) {
            btn.disabled = true;
            if (key === correct) {
              btn.classList.add("correct");
            }
            if (selected === key && selected !== correct) {
              btn.classList.add("incorrect");
            }
          }
        });

        if (selected === correct) {
          score++;
        }
      });

      const resultPanel = document.getElementById("result-panel");
      resultPanel.style.display = "block";
      resultPanel.innerText = `Ваш результат: ${score} з ${quizData.length} правильних відповідей.`;
      resultPanel.scrollIntoView({ behavior: 'smooth' });
    }

    renderQuiz();
  </script>
